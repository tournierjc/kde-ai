app-id: org.kde.kdeai
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
command: kde-ai-ui
finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=xdg-run/kde-ai:ro
  - --talk-name=org.kde.kdeai
modules:
  - name: kde-ai
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
      - install -Dm644 src/kde_ai/icons/org.kde.kdeai.svg /app/share/icons/hicolor/scalable/apps/org.kde.kdeai.svg
    sources:
      - type: dir
        path: ../..
