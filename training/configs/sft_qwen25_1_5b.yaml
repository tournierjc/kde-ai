model_name: Qwen/Qwen2.5-1.5B-Instruct
train_file: data/out/train.jsonl
output_dir: checkpoints/sft-1.5b
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
learning_rate: 2.0e-4
warmup_ratio: 0.03
num_train_epochs: 2
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
save_steps: 500
max_seq_length: 4096
packing: true
bf16: true
assistant_only_loss: true
attn_implementation: sdpa
