model_name: Qwen/Qwen2.5-3B-Instruct
sft_adapter: checkpoints/sft-3b
train_file: data/out/dpo.jsonl
output_dir: checkpoints/dpo-3b
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
beta: 0.1
learning_rate: 5.0e-7
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
warmup_steps: 2
max_seq_length: 4096
bf16: true
attn_implementation: sdpa
